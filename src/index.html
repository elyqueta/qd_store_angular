<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <title>QD · ItSOLUTIONS</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        const preference = localStorage.getItem('qd.theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle(
          'dark',
          preference === 'dark' || (preference !== 'light' && prefersDark),
        );
      } catch (error) {
        console.error('Não foi possível aplicar o tema antes da renderização.', error);
      }
    </script>
  </head>
  <body>
    <qd-root></qd-root>
  </body>
</html>
