<main class="flex min-h-[60vh] items-center justify-center px-4">
  <div class="text-center">
    <p class="text-6xl font-semibold tracking-tight text-brand">404</p>
    <h1 class="mt-4 text-3xl font-semibold tracking-tight text-fg">
      {{ 'public.notFound.title' | transloco }}
    </h1>
    <p class="mt-3 text-base text-fg-muted">{{ 'public.notFound.description' | transloco }}</p>
    <a
      [routerLink]="'/'"
      class="mt-8 inline-flex rounded-full bg-brand px-5 py-3 text-sm font-semibold text-brand-fg"
    >
      {{ 'public.notFound.backHome' | transloco }}
    </a>
  </div>
</main>
