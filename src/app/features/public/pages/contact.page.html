<main class="mx-auto max-w-4xl px-4 py-16 sm:px-6 lg:px-8">
  <div class="rounded-3xl border border-line bg-surface p-8 shadow-sm sm:p-10">
    <p class="text-xs font-medium uppercase tracking-[0.22em] text-fg-muted">
      {{ 'public.contact.kicker' | transloco }}
    </p>
    <h1 class="mt-4 text-4xl font-semibold tracking-tight text-fg">
      {{ 'public.contact.title' | transloco }}
    </h1>

    <a
      href="https://wa.me/244923000000"
      target="_blank"
      rel="noreferrer"
      class="mt-8 inline-flex rounded-full bg-brand px-6 py-3 text-sm font-semibold text-brand-fg transition-colors hover:opacity-90"
    >
      {{ 'public.contact.whatsapp' | transloco }} · +244 923 000 000
    </a>
  </div>
</main>
