<main class="mx-auto max-w-4xl px-4 py-16 sm:px-6 lg:px-8">
  <div class="rounded-3xl border border-line bg-surface p-8 shadow-sm sm:p-10">
    <p class="text-xs font-medium uppercase tracking-[0.22em] text-fg-muted">
      {{ 'public.about.kicker' | transloco }}
    </p>
    <h1 class="mt-4 text-4xl font-semibold tracking-tight text-fg">
      {{ 'public.about.title' | transloco }}
    </h1>
    <p class="mt-6 text-base leading-7 text-fg-muted">
      {{ 'public.about.description' | transloco }}
    </p>
  </div>
</main>
