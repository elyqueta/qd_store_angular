<section
  class="pointer-events-none fixed inset-x-4 top-4 z-[100] mx-auto flex max-w-md flex-col gap-3 sm:left-auto sm:right-6 sm:top-6"
  [attr.aria-label]="'notifications.regionLabel' | transloco"
>
  @for (toast of toastService.messages(); track trackToast($index, toast)) {
    <article
      class="pointer-events-auto flex items-start gap-3 rounded-xl border bg-surface p-4 text-fg shadow-xl"
      [class.border-success]="toast.kind === 'success'"
      [class.border-danger]="toast.kind === 'error'"
      [class.border-warning]="toast.kind === 'warning'"
      [attr.role]="toast.kind === 'error' ? 'alert' : 'status'"
      [attr.aria-live]="toast.kind === 'error' ? 'assertive' : 'polite'"
      aria-atomic="true"
    >
      <p class="min-w-0 flex-1 text-sm">{{ toast.message }}</p>
      <button
        class="shrink-0 rounded px-2 py-1 text-sm text-fg-muted hover:text-fg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand"
        type="button"
        [attr.aria-label]="'common.close' | transloco"
        (click)="toastService.dismiss(toast.id)"
      >
        {{ 'common.close' | transloco }}
      </button>
    </article>
  }
</section>
