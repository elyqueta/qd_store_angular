<div class="min-h-screen bg-surface-muted">
  <header class="border-b border-line bg-surface">
    <div
      class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-4 px-4 py-4 sm:px-6 lg:px-8"
    >
      <a
        routerLink="/admin"
        class="flex items-center gap-3 text-lg font-semibold tracking-tight text-fg"
        [attr.aria-label]="'admin.layout.title' | transloco"
      >
        <span
          class="flex h-10 w-10 items-center justify-center rounded-full bg-brand text-sm text-brand-fg"
          aria-hidden="true"
          >QD</span
        >
        <span>{{ 'admin.layout.title' | transloco }}</span>
      </a>

      <nav
        class="flex flex-wrap items-center gap-2 sm:gap-4"
        [attr.aria-label]="'admin.layout.navigation' | transloco"
      >
        <a
          routerLink="/admin"
          routerLinkActive="text-brand"
          [routerLinkActiveOptions]="{ exact: true }"
          class="rounded-full px-3 py-2 text-sm font-medium text-fg-muted transition-colors hover:text-brand"
        >
          {{ 'admin.layout.dashboard' | transloco }}
        </a>
        <a
          routerLink="/admin/categorias"
          routerLinkActive="text-brand"
          class="rounded-full px-3 py-2 text-sm font-medium text-fg-muted transition-colors hover:text-brand"
        >
          {{ 'admin.layout.categories' | transloco }}
        </a>
        <a
          routerLink="/admin/produtos"
          routerLinkActive="text-brand"
          class="rounded-full px-3 py-2 text-sm font-medium text-fg-muted transition-colors hover:text-brand"
        >
          {{ 'admin.layout.products' | transloco }}
        </a>
        <a
          routerLink="/admin/tipos-entrega"
          routerLinkActive="text-brand"
          class="rounded-full px-3 py-2 text-sm font-medium text-fg-muted transition-colors hover:text-brand"
        >
          {{ 'admin.layout.deliveryTypes' | transloco }}
        </a>
        <a
          routerLink="/admin/empresas"
          routerLinkActive="text-brand"
          class="rounded-full px-3 py-2 text-sm font-medium text-fg-muted transition-colors hover:text-brand"
        >
          {{ 'admin.layout.companies' | transloco }}
        </a>
        <a
          routerLink="/"
          class="rounded-full px-3 py-2 text-sm font-medium text-fg-muted transition-colors hover:text-brand"
        >
          {{ 'admin.layout.store' | transloco }}
        </a>
        <button
          type="button"
          class="rounded-full border border-line px-3 py-2 text-sm font-medium text-fg transition-colors hover:border-brand hover:text-brand focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand"
          [attr.aria-label]="'nav.themeToggle' | transloco"
          (click)="toggleTheme()"
        >
          @if (themeService.effective() === 'dark') {
            <span aria-hidden="true">☀️</span>
          } @else {
            <span aria-hidden="true">🌙</span>
          }
        </button>
        <button
          type="button"
          class="rounded-full border border-line px-4 py-2 text-sm font-medium text-fg transition-colors hover:border-brand hover:text-brand focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand"
          (click)="logout()"
        >
          {{ 'admin.layout.logout' | transloco }}
        </button>
      </nav>
    </div>
  </header>

  <router-outlet />
</div>
